# Render 배포 설정 (Blueprint): 게임 파일과 멀티 서버를 한 주소에서 제공
#  Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply
#  이후로는 GitHub main에 올라온 업데이트가 자동으로 배포됨 (Blueprint 동기화 + 커밋마다 자동 배포)
services:
  - type: web
    name: project-dungeon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: commit # main에 새 커밋이 올라오면 자동으로 다시 배포
    envVars: # 랭킹판 영구 저장 (선택): GitHub 토큰을 넣으면 기록을 이 저장소의 scores 브랜치에 저장 → 서버가 다시 시작돼도 유지
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        value: yubinl3756-lgtm/dungeon_
      - key: GH_BRANCH
        value: scores
