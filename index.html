const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angleDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return Math.abs(d); };
function weightedPick(items, wfn) {
  let total = 0;
  for (const it of items) total += wfn(it);
  let r = Math.random() * total;
  for (const it of items) { r -= wfn(it); if (r <= 0) return it; }
  return items[items.length - 1];
}
function shuffled(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }

class InputManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.down = new Set();
    this.pressed = new Set();
    this.mouse = { x: VIEW_W / 2, y: VIEW_H / 2, down: false, rdown: false };
    const blocked = new Set(['Space', 'Tab', 'KeyQ', 'KeyE', 'KeyR', 'KeyF']);
    window.addEventListener('keydown', (e) => {
      if (blocked.has(e.code)) e.preventDefault();
      if (!this.down.has(e.code)) this.pressed.add(e.code);
      this.down.add(e.code);
    });
    window.addEventListener('keyup', (e) => this.down.delete(e.code));
    window.addEventListener('blur', () => { this.down.clear(); this.mouse.down = false; });
    window.addEventListener('mousemove', (e) => this.updatePointer(e));
    canvas.addEventListener('mousedown', (e) => {
      this.updatePointer(e);
      if (e.button === 0) { this.mouse.down = true; this.pressed.add('Mouse0'); }
      if (e.button === 2) this.pressed.add('Mouse2');
    });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) this.mouse.down = false; });
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); this.pressed.add('Wheel'); }, { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  updatePointer(e) {
    const r = this.canvas.getBoundingClientRect();
    this.mouse.x = (e.clientX - r.left) * (VIEW_W / r.width);
    this.mouse.y = (e.clientY - r.top) * (VIEW_H / r.height);
  }
  isDown(c) { return this.down.has(c); }
  wasPressed(c) { return this.pressed.has(c); }
  endStep() { this.pressed.clear(); }
}

// ════════════════════════════════════════════
// 고정 timestep 루프
// ════════════════════════════════════════════
class GameLoop {
  constructor(update, render) {
    this.update = update; this.render = render; this.acc = 0; this.last = 0;
    this.frame = this.frame.bind(this);
  }
  start() { this.last = performance.now(); requestAnimationFrame(this.frame); }
  frame(now) {
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (dt > 0.25) dt = 0.25;
    this.acc += dt;
    let steps = 0;
    while (this.acc >= STEP && steps < 8) { this.update(STEP); this.acc -= STEP; steps++; }
    if (steps === 8) this.acc = 0;
    this.render();
    requestAnimationFrame(this.frame);
  }
}

// ════════════════════════════════════════════
// 충돌
// ════════════════════════════════════════════
function overlapsSolid(x, y, half, map) {
  const x0 = Math.floor((x - half) / TILE), x1 = Math.floor((x + half - EPS) / TILE);
  const y0 = Math.floor((y - half) / TILE), y1 = Math.floor((y + half - EPS) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (map.isSolidTile(tx, ty)) return true;
  return false;
}

function moveAndCollide(ent, dx, dy, map) {
  const hit = { x: false, y: false };
  if (dx !== 0) {
    ent.x += dx;
    if (overlapsSolid(ent.x, ent.y, ent.half, map)) {
      if (dx > 0) ent.x = Math.floor((ent.x + ent.half - EPS) / TILE) * TILE - ent.half;
      else ent.x = (Math.floor((ent.x - ent.half) / TILE) + 1) * TILE + ent.half;
      hit.x = true;
    }
  }
  if (dy !== 0) {
    ent.y += dy;
    if (overlapsSolid(ent.x, ent.y, ent.half, map)) {
      if (dy > 0) ent.y = Math.floor((ent.y + ent.half - EPS) / TILE) * TILE - ent.half;
      else ent.y = (Math.floor((ent.y - ent.half) / TILE) + 1) * TILE + ent.half;
      hit.y = true;
    }
  }
  return hit;
}

function sweepWall(x0, y0, x1, y1, map, stepLen = 2) {
  const dx = x1 - x0, dy = y1 - y0;
  const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / stepLen));
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    if (map.isSolidAt(x0 + dx * t, y0 + dy * t)) return (i - 1) / n;
  }
  return -1;
}
const hasLineOfSight = (a, b, map) => sweepWall(a.x, a.y, b.x, b.y, map, 6) < 0;

function segmentCircleHit(x0, y0, x1, y1, cx, cy, r) {
  const dx = x1 - x0, dy = y1 - y0, fx = x0 - cx, fy = y0 - cy;
  const a = dx * dx + dy * dy;
  let t = a === 0 ? 0 : -(fx * dx + fy * dy) / a;
  t = Math.max(0, Math.min(1, t));
  const px = fx + dx * t, py = fy + dy * t;
  return px * px + py * py <= r * r ? t : -1;
}

function separateEnemies(enemies, map) {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (!a.alive || a.state === 'SPAWN' || a.def.dummy) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (!b.alive || b.state === 'SPAWN' || b.def.dummy) continue;
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      const min = a.radius + b.radius;
      if (d >= min) continue;
      if (d < 0.0001) { dx = 1; dy = 0; d = 1; }
      const overlap = min - d, nx = dx / d, ny = dy / d;
      const wa = b.radius / min, wb = a.radius / min;
      moveAndCollide(a, -nx * overlap * wa, -ny * overlap * wa, map);
      moveAndCollide(b, nx * overlap * wb, ny * overlap * wb, map);
    }
  }
}

// 피해 계산: D = B × (1 + A) × C
function rollDamage(base, mods) {
  const crit = Math.random() < mods.critChance;
  const amount = base * (1 + mods.attackBonus) * (crit ? mods.critMultiplier : 1);
  return { amount: Math.max(1, Math.round(amount)), crit };
}

class DungeonMap {
  constructor(w, h, palette) {
    this.width = w; this.height = h; this.palette = palette;
    this.tiles = new Uint8Array(w * h);
    this.rooms = []; this.edges = []; this.cache = null; this.decorate = null;
  }
  get(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.width || ty >= this.height) return T_VOID;
    return this.tiles[ty * this.width + tx];
  }
  set(tx, ty, v) {
    if (tx < 0 || ty < 0 || tx >= this.width || ty >= this.height) return;
    this.tiles[ty * this.width + tx] = v;
  }
  isSolidTile(tx, ty) { return this.get(tx, ty) !== T_FLOOR; }
  isSolidAt(px, py) { return this.isSolidTile(Math.floor(px / TILE), Math.floor(py / TILE)); }
  tileCenter(tx, ty) { return { x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 }; }
  roomAtPoint(px, py) {
    const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
    for (const r of this.rooms)
      if (tx >= r.x0 && tx < r.x0 + r.w && ty >= r.y0 && ty < r.y0 + r.h) return r;
    return null;
  }
  isFullyInside(ent, r) {
    const m = TILE / 2;
    return ent.x - ent.half >= r.x0 * TILE + m && ent.x + ent.half <= (r.x0 + r.w) * TILE - m &&
           ent.y - ent.half >= r.y0 * TILE + m && ent.y + ent.half <= (r.y0 + r.h) * TILE - m;
  }
  setDoors(room, closed) { for (const d of room.doors) this.set(d.x, d.y, closed ? T_DOOR : T_FLOOR); }
  carveRoom(x0, y0, w, h) {
    for (let ty = y0 - 1; ty <= y0 + h; ty++)
      for (let tx = x0 - 1; tx <= x0 + w; tx++) this.set(tx, ty, T_WALL);
    for (let ty = y0; ty < y0 + h; ty++)
      for (let tx = x0; tx < x0 + w; tx++) this.set(tx, ty, T_FLOOR);
  }

  buildCache() {
    const pal = this.palette;
    const c = document.createElement('canvas');
    c.width = this.width * TILE; c.height = this.height * TILE;
    const g = c.getContext('2d');
    const floorAt = (tx, ty) => this.get(tx, ty) === T_FLOOR;
    const inRoom = new Uint8Array(this.width * this.height);
    for (const r of this.rooms)
      for (let ty = r.y0; ty < r.y0 + r.h; ty++) for (let tx = r.x0; tx < r.x0 + r.w; tx++) inRoom[ty * this.width + tx] = 1;
    for (let ty = 0; ty < this.height; ty++)
      for (let tx = 0; tx < this.width; tx++) {
        if (!floorAt(tx, ty)) continue;
        const cols = inRoom[ty * this.width + tx] ? pal.floor : pal.corridor;
        drawFloorTile(g, tx * TILE, ty * TILE, cols[(tx + ty) % 2], pal.style);
        if (pal.deco && Math.random() < 0.07) { g.fillStyle = pal.deco; g.fillRect(tx * TILE + randInt(2, 12), ty * TILE + randInt(2, 12), 2, 1); }
      }
    const overlay = { boss: 'rgba(200,40,60,0.13)', treasure: 'rgba(220,180,60,0.10)', shop: 'rgba(80,200,120,0.10)',
      exit: 'rgba(80,160,255,0.12)', start: 'rgba(80,140,255,0.05)' };
    for (const r of this.rooms)
      if (overlay[r.type]) { g.fillStyle = overlay[r.type]; g.fillRect(r.x0 * TILE, r.y0 * TILE, r.w * TILE, r.h * TILE); }
    if (this.decorate) this.decorate(g);
    for (let ty = 0; ty < this.height; ty++)
      for (let tx = 0; tx < this.width; tx++) {
        const t = this.get(tx, ty);
        if (t !== T_WALL && t !== T_DOOR) continue;
        const face = floorAt(tx, ty + 1);
        drawWallTile(g, tx * TILE, ty * TILE, pal, face);
        if (face) { g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(tx * TILE, (ty + 1) * TILE, TILE, 3); }
      }
    this.cache = c;
  }
  render(ctx, cam) {
    if (!this.cache) this.buildCache();
    const sx = Math.max(0, Math.floor(cam.x)), sy = Math.max(0, Math.floor(cam.y));
    const sw = Math.min(VIEW_W + 2, this.cache.width - sx), sh = Math.min(VIEW_H + 2, this.cache.height - sy);
    if (sw > 0 && sh > 0) ctx.drawImage(this.cache, sx, sy, sw, sh, sx, sy, sw, sh);
  }
  renderDoors(ctx, time) {
    for (const r of this.rooms) {
      if (r.state !== 'active') continue;
      for (const d of r.doors) {
        const x = d.x * TILE, y = d.y * TILE;
        ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#2a1c10';
        for (let i = 2; i < TILE; i += 4) ctx.fillRect(x + i, y, 2, TILE);
        ctx.fillStyle = `rgba(255,80,60,${0.4 + 0.3 * Math.sin(time * 6)})`; ctx.fillRect(x, y, TILE, 2);
      }
    }
  }
}

// ── 절차적 던전: 5x5 격자 위 랜덤 트리 → 특수방은 먼 막다른 방부터 배정
function generateDungeon(opts) {
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const key = (x, y) => x + ',' + y;
  const cells = new Map(), order = [], edges = [];
  const add = (gx, gy) => { const c = { gx, gy, links: [] }; cells.set(key(gx, gy), c); order.push(c); return c; };
  const start = add(2, 2);
  let guard = 0;
  while (order.length < opts.roomCount && guard++ < 5000) {
    const from = pick(order);
    if (from.links.length >= 3) continue;
    const [dx, dy] = pick(DIRS);
    const nx = from.gx + dx, ny = from.gy + dy;
    if (nx < 0 || ny < 0 || nx >= GRID_W || ny >= GRID_H || cells.has(key(nx, ny))) continue;
    const c = add(nx, ny);
    from.links.push(c); c.links.push(from); edges.push([from, c]);
  }
  start.dist = 0;
  const q = [start];
  while (q.length) { const c = q.shift(); for (const n of c.links) if (n.dist === undefined) { n.dist = c.dist + 1; q.push(n); } }
  const leaves = order.filter((c) => c !== start && c.links.length === 1).sort((a, b) => b.dist - a.dist);
  start.type = 'start';
  const assigned = new Set([start]);
  for (const type of opts.specials) {
    const cell = leaves.find((c) => !assigned.has(c)) || pick(order.filter((c) => !assigned.has(c)));
    if (!cell) break;
    cell.type = type; assigned.add(cell);
  }
  for (const c of order) if (!c.type) c.type = 'combat';

  const map = new DungeonMap(GRID_W * CELL_W, GRID_H * CELL_H, opts.palette);
  const SIZES = { start: [11, 9], treasure: [11, 9], shop: [13, 9], exit: [11, 9], boss: [23, 17] };
  for (const c of order) {
    const [w, h] = SIZES[c.type] || [15 + 2 * randInt(0, 2), 11 + 2 * randInt(0, 1)];
    const cx = c.gx * CELL_W + (CELL_W >> 1), cy = c.gy * CELL_H + (CELL_H >> 1);
    const x0 = cx - (w >> 1), y0 = cy - (h >> 1);
    const room = { type: c.type, gx: c.gx, gy: c.gy, x0, y0, w, h, cx, cy, doors: [],
      state: (c.type === 'combat' || c.type === 'boss') ? 'idle' : 'cleared',
      visited: c.type === 'start', wavesLeft: c.type === 'combat' ? opts.waves : 0 };
    c.room = room;
    map.carveRoom(x0, y0, w, h);
    if (c.type === 'combat') placeCover(map, room);
    map.rooms.push(room);
  }
  for (const [a, b] of edges) {
    const ra = a.room, rb = b.room;
    if (a.gy === b.gy) {
      const L = ra.gx < rb.gx ? ra : rb, R = L === ra ? rb : ra, y = L.cy;
      const xs = L.x0 + L.w, xe = R.x0 - 1;
      for (let x = xs; x <= xe; x++) {
        for (let d = -1; d <= 1; d++) map.set(x, y + d, T_FLOOR);
        for (const d of [-2, 2]) if (map.get(x, y + d) === T_VOID) map.set(x, y + d, T_WALL);
      }
      for (let d = -1; d <= 1; d++) { L.doors.push({ x: xs, y: y + d }); R.doors.push({ x: xe, y: y + d }); }
    } else {
      const T = ra.gy < rb.gy ? ra : rb, B = T === ra ? rb : ra, x = T.cx;
      const ys = T.y0 + T.h, ye = B.y0 - 1;
      for (let y = ys; y <= ye; y++) {
        for (let d = -1; d <= 1; d++) map.set(x + d, y, T_FLOOR);
        for (const d of [-2, 2]) if (map.get(x + d, y) === T_VOID) map.set(x + d, y, T_WALL);
      }
      for (let d = -1; d <= 1; d++) { T.doors.push({ x: x + d, y: ys }); B.doors.push({ x: x + d, y: ye }); }
    }
    map.edges.push([ra, rb]);
  }
  map.startRoom = start.room;
  map.roomOf = (type) => map.rooms.find((r) => r.type === type) || null;
  return map;
}

function placeCover(map, r) {
  const block = (x, y, w, h) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) map.set(x + i, y + j, T_WALL); };
  const { cx, cy } = r;
  switch (randInt(0, 3)) {
    case 0: block(cx - 5, cy - 3, 2, 2); block(cx + 4, cy - 3, 2, 2); block(cx - 5, cy + 2, 2, 2); block(cx + 4, cy + 2, 2, 2); break;
    case 1: block(cx - 3, cy - 3, 7, 1); block(cx - 3, cy + 3, 7, 1); break;
    case 2: block(cx - 1, cy - 1, 3, 3); break;
    default: break;
  }
}

// ── 로비 맵 (고정 레이아웃)
function buildLobby() {
  const map = new DungeonMap(34, 24, LOBBY_PALETTE);
  const room = { type: 'lobby', gx: 0, gy: 0, x0: 3, y0: 4, w: 28, h: 16, cx: 17, cy: 12, doors: [], state: 'cleared', visited: true, wavesLeft: 0 };
  map.carveRoom(room.x0, room.y0, room.w, room.h);
  // 기둥
  for (const [x, y] of [[6, 7], [27, 7], [6, 16], [27, 16]]) map.set(x, y, T_WALL);
  map.rooms.push(room);
  map.startRoom = room;
  map.decorate = (g) => {
    // 카펫
    g.fillStyle = '#5a2a2a'; g.fillRect(12 * TILE, 10 * TILE, 10 * TILE, 7 * TILE);
    g.fillStyle = '#7a3a34'; g.fillRect(12 * TILE + 3, 10 * TILE + 3, 10 * TILE - 6, 7 * TILE - 6);
    g.fillStyle = '#c89a40';
    g.fillRect(12 * TILE + 6, 10 * TILE + 6, 10 * TILE - 12, 1); g.fillRect(12 * TILE + 6, 17 * TILE - 7, 10 * TILE - 12, 1);
    // 캐릭터 단상 바닥 띠
    g.fillStyle = 'rgba(255,220,150,0.06)'; g.fillRect(9 * TILE, 4 * TILE, 16 * TILE, 5 * TILE);
  };
  return map;
}

// 픽셀 아트 (오리지널 도트)
//  문자 격자 → 시작 시 오프스크린 캔버스로 굽고 캐시
//  공통 문자: k=외곽선, a/b/c=기본색/어두운색/밝은색(색 바꿔 재사용), .=투명
// ════════════════════════════════════════════
const OUTLINE = '#14101c';
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, k) {
  const f = (v) => clamp(Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1)), 0, 255);
  const [r, g, b] = hexRgb(hex); return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function bakeSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  const make = (flip, white) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      const col = white ? '#ffffff' : pal[ch];
      if (!col) continue;
      g.fillStyle = col; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
    }
    return c;
  };
  return { w, h, n: make(false, false), f: make(true, false), wn: make(false, true), wf: make(true, true) };
}
// x,y = 발밑 중앙
function drawSprite(ctx, spr, x, y, o = {}) {
  const sc = o.scale || 1, sq = o.squash || 0;
  const img = o.white ? (o.flip ? spr.wf : spr.wn) : (o.flip ? spr.f : spr.n);
  const w = spr.w * sc + sq * 2, h = spr.h * sc - sq;
  ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h), w, h);
}

const spriteCache = new Map();
function getSprite(name, color, color2) {
  const key = name + '|' + (color || '') + '|' + (color2 || '');
  let s = spriteCache.get(key);
  if (s) return s;
  const t = PIX[name];
  if (!t) throw new Error('알 수 없는 스프라이트: ' + name);
  const base = color || t.tint, pal = { k: OUTLINE };
  if (base) { pal.a = base; pal.b = shade(base, 0.68); pal.c = shade(base, 1.35); }
  Object.assign(pal, t.pal);
  if (color2) pal.e = color2;
  s = bakeSprite(t.rows, pal); spriteCache.set(key, s); return s;
}
function heroSprite(hero, frame) {
  const key = 'hero|' + hero.id + '|' + frame;
  let s = spriteCache.get(key);
  if (s) return s;
  const L = hero.look;
  const pal = { k: OUTLINE, s: '#f0c8a0', a: L.body, b: shade(L.body, 0.68), m: '#c9d6e0', w: '#ffffff', r: L.accent,
    y: '#e0c060', l: '#3a3048', h: L.accent, g: shade(L.accent, 0.68), e: '#7ad0ff' };
  s = bakeSprite(HERO_HEADS[L.hat].concat(HERO_LEGS[frame]), pal); spriteCache.set(key, s); return s;
}
function weaponSprite(def) {
  const key = 'wpn|' + def.id;
  let s = spriteCache.get(key);
  if (s) return s;
  const t = WPIX[WEAPON_SPRITE[def.id]] || WPIX.pistol;
  const pal = { k: OUTLINE, a: def.color, b: shade(def.color, 0.65), c: shade(def.color, 1.4), o: def.bulletColor || '#ffffff',
    w: '#ffffff', d: '#7a5530', y: '#d0a040', s: '#dddddd' };
  s = bakeSprite(t.rows, pal); s.px = t.p[0]; s.py = t.p[1]; spriteCache.set(key, s); return s;
}

function drawHero(ctx, hero, x, y, face, frame, dash) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x - 5, y + 6, 10, 2);
  const spr = heroSprite(hero, frame);
  drawSprite(ctx, spr, x, y + 7, { flip: face < 0 });
  if (dash) { ctx.globalAlpha = 0.55; drawSprite(ctx, spr, x, y + 7, { flip: face < 0, white: true }); ctx.globalAlpha = 1; }
}

function drawWeapon(ctx, def, x, y, angle) {
  const spr = weaponSprite(def);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(angle);
  if (Math.cos(angle) < 0) ctx.scale(1, -1);
  ctx.drawImage(spr.n, -spr.px, -spr.py);
  ctx.restore();
}
// 무기를 가운데 정렬로 그리기 (바닥/상점/HUD용)
function drawWeaponCentered(ctx, def, cx, cy) {
  const s = weaponSprite(def);
  drawWeapon(ctx, def, cx - s.w / 2 + s.px, cy - s.h / 2 + s.py, 0);
}

function drawEnemy(ctx, e, x, y, flash) {
  const def = e.def, enr = def.boss && e.hp < e.maxHp * 0.5;
  const color = enr && def.enrageColor ? def.enrageColor : def.color;
  const color2 = def.sprite === 'mage' ? def.bulletColor : (def.sprite === 'boss_frost' && enr ? '#ff5a7a' : undefined);
  const spr = getSprite(def.sprite, color, color2), sc = def.boss ? 2 : 1;
  let sq = 0, oy = 0;
  if (e.state === 'TELEGRAPH' && ['slime', 'shroom', 'golem', 'boss_gel', 'boss_frost'].includes(def.sprite)) sq = def.boss ? 4 : 2;
  else if (def.sprite === 'slime' || def.sprite === 'boss_gel') sq = Math.round((Math.sin(e.stateTime * (def.boss ? 4 : 9)) + 1) * (def.boss ? 1 : 0.6));
  if (def.sprite === 'imp' || def.sprite === 'boss_flame') oy = Math.round(Math.sin(e.stateTime * (def.boss ? 3 : 9)) * 1.5) - (def.boss ? 4 : 3);
  const lift = Math.round(e.jumpH || 0), bottom = y + def.hitboxHalf + 1;
  const sw = Math.round(spr.w * sc * 0.65 - Math.min(10, lift / 4));
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(Math.round(x - sw / 2), bottom - 2, sw, def.boss ? 3 : 2);
  if (def.sprite === 'boss_flame') {
    ctx.fillStyle = `rgba(255,120,40,${0.18 + 0.1 * Math.sin(e.stateTime * 10)})`;
    ctx.beginPath(); ctx.arc(x, bottom - 16 + oy, 22, 0, TAU); ctx.fill();
  }
  const blink = def.sprite === 'bomber' && e.state === 'TELEGRAPH' && Math.floor(e.stateTime * 16) % 2 === 0;
  const by = bottom - lift + oy;
  drawSprite(ctx, spr, x, by, { flip: e.face < 0, white: flash || blink, scale: sc, squash: sq });
  const top = by - spr.h * sc;
  if (def.sprite === 'mage') {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(e.stateTime * 5);
    ctx.fillStyle = def.bulletColor || '#d070ff'; ctx.fillRect(x - 1, top - 2, 3, 3);
    ctx.globalAlpha = 1;
  }
  if (e.state === 'STUN') {
    ctx.fillStyle = '#ffe36b';
    for (let i = 0; i < 3; i++) {
      const a = e.stateTime * 6 + i * TAU / 3;
      ctx.fillRect(Math.round(x + Math.cos(a) * 7), Math.round(top + Math.sin(a) * 2), 2, 2);
    }
  }
}

function drawPotion(ctx, x, y, color) { drawSprite(ctx, getSprite('potion', color), x, y + 4); }

function drawFloorTile(g, x, y, base, style) {
  g.fillStyle = base; g.fillRect(x, y, TILE, TILE);
  if (style === 'wood') {
    const d = shade(base, 0.78), l = shade(base, 1.1);
    for (let i = 0; i < TILE; i += 4) { g.fillStyle = l; g.fillRect(x, y + i, TILE, 1); g.fillStyle = d; g.fillRect(x, y + i + 3, TILE, 1); }
    g.fillStyle = d;
    for (let i = 0; i < 4; i++) g.fillRect(x + ((x / TILE * 5 + y / TILE * 3 + i * 7) % TILE), y + i * 4, 1, 3);
    return;
  }
  const hi = shade(base, 1.1), lo = shade(base, 0.76), sp = shade(base, 0.88);
  g.fillStyle = hi; g.fillRect(x, y, TILE - 1, 1); g.fillRect(x, y, 1, TILE - 1);
  g.fillStyle = lo; g.fillRect(x + TILE - 1, y, 1, TILE); g.fillRect(x, y + TILE - 1, TILE, 1);
  g.fillStyle = sp;
  for (let i = 0; i < 3; i++) g.fillRect(x + randInt(2, 12), y + randInt(2, 12), randInt(1, 2), 1);
  if (Math.random() < 0.08) {
    g.fillStyle = lo; let cx = x + randInt(3, 10), cy = y + randInt(3, 9);
    for (let i = 0; i < 4; i++) { g.fillRect(cx, cy, 1, 1); cx += randInt(0, 1); cy++; }
  }
}
function drawWallTile(g, x, y, pal, face) {
  g.fillStyle = pal.wall; g.fillRect(x, y, TILE, TILE);
  g.fillStyle = shade(pal.wall, 0.8);
  for (let r = 0; r < 4; r++) {
    g.fillRect(x, y + r * 4 + 3, TILE, 1);
    const off = ((y / TILE * 4 + r) % 2) * 4;
    g.fillRect(x + off, y + r * 4, 1, 3); g.fillRect(x + off + 8, y + r * 4, 1, 3);
  }
  g.fillStyle = pal.wallTop; g.fillRect(x, y, TILE, 1);
  if (face) {
    g.fillStyle = pal.wallFace; g.fillRect(x, y + 8, TILE, 8);
    g.fillStyle = shade(pal.wallFace, 1.15); g.fillRect(x, y + 8, TILE, 1);
    g.fillStyle = pal.faceLine;
    g.fillRect(x, y + 12, TILE, 1);
    g.fillRect(x + ((x / TILE) % 2 ? 4 : 11), y + 9, 1, 3); g.fillRect(x + ((x / TILE) % 2 ? 11 : 4), y + 13, 1, 3);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x, y + TILE - 1, TILE, 1);
  }
}

let nextEntityId = 1;
class Entity {
  constructor(x, y, half) {
    this.id = nextEntityId++;
    this.x = x; this.y = y; this.half = half; this.radius = half;
    this.alive = true; this.removed = false;
  }
}

class Player extends Entity {
  constructor(x, y, hero, base) {
    super(x, y, base.hitboxHalf);
    this.hero = hero; this.cfg = base;
    this.maxHp = hero.maxHp; this.hp = hero.maxHp;
    this.maxShield = hero.maxShield; this.shield = hero.maxShield;
    this.maxEnergy = hero.maxEnergy; this.energy = hero.maxEnergy;
    this.moveSpeed = hero.moveSpeed;
    this.dashCdMax = base.dashCooldown; this.skillCdMax = hero.skillCooldown;
    this.state = 'NORMAL';
    this.aim = { x: 1, y: 0 }; this.lastMoveDir = { x: 1, y: 0 }; this.dashDir = { x: 1, y: 0 };
    this.dashRemaining = 0; this.dashCooldown = 0; this.dashInvuln = 0; this.hurtInvuln = 0;
    this.skillCooldown = 0; this.whirl = 0; this.whirlTick = 0; this.overdrive = 0; this.vampire = 0;
    this.sinceHit = 99; this.deathTimer = 0; this.time = 0; this.moving = false;
    this.swing = null;
    this.stats = { attackBonus: 0, fireRateBonus: 0, critChance: base.critChance, critMultiplier: base.critMultiplier };
    this.weapons = []; this.slot = 0; this.buffs = [];
  }
  get weapon() { return this.weapons[this.slot] || null; }
  get isInvulnerable() { return this.dashInvuln > 0 || this.hurtInvuln > 0 || this.whirl > 0; }
  get mods() { return { attackBonus: this.stats.attackBonus, critChance: this.stats.critChance, critMultiplier: this.stats.critMultiplier }; }

  update(dt, input, map, mouseWorld) {
    this.time += dt;
    if (this.state === 'DEAD') { this.deathTimer += dt; return; }
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.skillCooldown = Math.max(0, this.skillCooldown - dt);
    this.dashInvuln = Math.max(0, this.dashInvuln - dt);
    this.hurtInvuln = Math.max(0, this.hurtInvuln - dt);
    this.overdrive = Math.max(0, this.overdrive - dt);
    if (this.swing) { this.swing.t += dt; if (this.swing.t >= this.swing.dur) this.swing = null; }
    this.sinceHit += dt;
    if (this.sinceHit >= this.cfg.shieldRegenDelay)
      this.shield = Math.min(this.maxShield, this.shield + this.cfg.shieldRegenRate * dt);

    const ax = mouseWorld.x - this.x, ay = mouseWorld.y - this.y, alen = Math.hypot(ax, ay);
    if (alen > 0.5) { this.aim.x = ax / alen; this.aim.y = ay / alen; }

    let ix = 0, iy = 0;
    if (input.isDown('KeyA')) ix -= 1;
    if (input.isDown('KeyD')) ix += 1;
    if (input.isDown('KeyW')) iy -= 1;
    if (input.isDown('KeyS')) iy += 1;
    const ilen = Math.hypot(ix, iy);
    this.moving = ilen > 0;
    if (ilen > 0) { ix /= ilen; iy /= ilen; this.lastMoveDir.x = ix; this.lastMoveDir.y = iy; }

    if (this.state === 'DASH') { this.updateDash(dt, map); return; }
    if (input.wasPressed('Space') && this.dashCooldown <= 0) {
      this.startDash(); this.updateDash(dt, map); return;
    }
    moveAndCollide(this, ix * this.moveSpeed * dt, iy * this.moveSpeed * dt, map);
  }
  startDash() {
    this.state = 'DASH';
    this.dashDir.x = this.lastMoveDir.x; this.dashDir.y = this.lastMoveDir.y;
    this.dashRemaining = this.cfg.dashSpeed * this.cfg.dashDuration;
    this.dashCooldown = this.dashCdMax;
    this.dashInvuln = this.cfg.dashInvuln;
  }
  updateDash(dt, map) {
    const dist = Math.min(this.cfg.dashSpeed * dt, this.dashRemaining);
    this.dashRemaining -= dist;
    const hit = moveAndCollide(this, this.dashDir.x * dist, this.dashDir.y * dist, map);
    if (hit.x || hit.y || this.dashRemaining <= 0) this.state = 'NORMAL';
  }
  takeDamage(amount) {
    if (this.state === 'DEAD' || this.isInvulnerable) return false;
    this.sinceHit = 0;
    const absorbed = Math.min(this.shield, amount);
    this.shield -= absorbed;
    this.hp = Math.max(0, this.hp - (amount - absorbed));
    this.hurtInvuln = this.cfg.hurtInvuln;
    if (this.hp <= 0) { this.state = 'DEAD'; this.deathTimer = 0; }
    return true;
  }
  weaponAngle() {
    const aimAng = Math.atan2(this.aim.y, this.aim.x);
    if (!this.swing) return aimAng;
    const s = this.swing, k = s.t / s.dur, dir = this.aim.x < 0 ? -1 : 1;
    if (s.thrust) return aimAng;
    return s.ang + dir * (-s.arc / 2 + s.arc * k);
  }
  render(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y);
    const face = this.aim.x < 0 ? -1 : 1;
    if (this.state === 'DEAD') {
      const spr = heroSprite(this.hero, 0);
      ctx.save(); ctx.translate(x, y + 3); ctx.rotate(face * Math.PI / 2); ctx.globalAlpha = 0.85;
      ctx.drawImage(spr.n, -spr.w / 2, -spr.h / 2); ctx.restore(); ctx.globalAlpha = 1; return;
    }
    if (this.hurtInvuln > 0 && Math.floor(this.time * 20) % 2 === 0) return;
    const frame = this.moving && this.state !== 'DASH' ? Math.floor(this.time * 8) % 2 : 0;
    if (this.overdrive > 0) {
      ctx.fillStyle = `rgba(255,200,60,${0.25 + 0.15 * Math.sin(this.time * 20)})`;
      ctx.beginPath(); ctx.arc(x, y - 1, 12, 0, TAU); ctx.fill();
    }
    const w = this.weapon, behind = this.aim.y < -0.35;
    const drawW = () => {
      if (!w) return;
      const ang = this.weaponAngle();
      const reach = this.swing && this.swing.thrust ? Math.sin(Math.PI * this.swing.t / this.swing.dur) * 10 : 0;
      drawWeapon(ctx, w.def, x + Math.cos(ang) * (3 + reach), y + 2 + Math.sin(ang) * (3 + reach), ang);
    };
    if (behind) drawW();
    drawHero(ctx, this.hero, x, y, face, frame, this.state === 'DASH');
    if (!behind) drawW();
    if (this.whirl > 0) {
      ctx.strokeStyle = 'rgba(220,240,255,0.8)'; ctx.lineWidth = 2;
      const a = this.time * 30;
      ctx.beginPath(); ctx.arc(x, y - 1, 30, a, a + 2.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - 1, 30, a + Math.PI, a + Math.PI + 2.2); ctx.stroke();
      ctx.lineWidth = 1;
    }
    if (w && w.charge > 0) {
      const k = Math.min(1, w.charge / w.def.chargeTime);
      ctx.fillStyle = '#111'; ctx.fillRect(x - 8, y + 10, 16, 3);
      ctx.fillStyle = k >= 1 ? '#fff' : '#f0c040'; ctx.fillRect(x - 8, y + 10, Math.round(16 * k), 3);
    }
  }
}

class Enemy extends Entity {
  constructor(x, y, def, scale, room) {
    super(x, y, def.hitboxHalf);
    this.def = def; this.room = room;
    this.maxHp = Math.round(def.health * (def.dummy ? 1 : scale.hp)); this.hp = this.maxHp;
    this.damage = Math.round(def.damage * scale.dmg);
    this.state = def.dummy ? 'IDLE' : 'SPAWN'; this.stateTime = 0; this.attackCd = 0.5 + Math.random() * 0.8;
    this.hurtFlash = 0; this.rewardGiven = false; this.face = 1; this.exploded = false;
    this.strafe = Math.random() < 0.5 ? -1 : 1; this.strafeT = 1 + Math.random() * 2;
    this.aimAng = 0; this.dashX = 0; this.dashY = 0; this.dashHit = false;
    this.spin = Math.random() * TAU; this.pat = null; this.lastPat = null; this.pd = {}; this.jumpH = 0;
    this.burn = 0; this.burnDps = 0; this.poison = 0; this.poisonDps = 0; this.slow = 0; this.slowK = 1; this.dotTimer = 0.5;
  }
  get targetable() { return this.alive && this.state !== 'SPAWN'; }
  get speedMul() { return this.slow > 0 ? this.slowK : 1; }
  setState(s) { this.state = s; this.stateTime = 0; }
  takeHit(amount) {
    if (!this.targetable) return false;
    this.hp = Math.max(0, this.hp - amount);
    this.hurtFlash = 0.08;
    if (this.def.dummy) { this.hp = this.maxHp; return true; }
    if (this.hp <= 0) { this.alive = false; this.setState('DEAD'); }
    return true;
  }
  applyStatus(st) {
    if (!st || Math.random() > st.chance) return;
    if (st.type === 'burn') { this.burn = Math.max(this.burn, st.duration); this.burnDps = Math.max(this.burnDps, st.dps); }
    else if (st.type === 'poison') { this.poison = Math.max(this.poison, st.duration); this.poisonDps = Math.max(this.poisonDps, st.dps); }
    else if (st.type === 'freeze') { this.slow = Math.max(this.slow, st.duration); this.slowK = this.def.boss ? Math.max(0.7, st.slow) : st.slow; }
  }
  renderTelegraph(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y), def = this.def;
    if (this.state === 'SPAWN') {
      const k = this.stateTime / SPAWN_TIME;
      ctx.strokeStyle = `rgba(255,80,80,${0.4 + 0.5 * k})`;
      ctx.beginPath(); ctx.arc(x, y, 3 + (1 - k) * 10, 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(255,80,80,${0.25 * k})`; ctx.beginPath(); ctx.arc(x, y, def.hitboxHalf + 2, 0, TAU); ctx.fill();
      return;
    }
    if (this.state === 'ATTACK' && def.boss && this.pat && this.pat.type === 'charge' && this.pd.phase === 'aim') {
      ctx.strokeStyle = 'rgba(200,240,255,0.7)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + this.dashX * 200, y + this.dashY * 200); ctx.stroke(); ctx.lineWidth = 1;
    }
    if (this.state !== 'TELEGRAPH') return;
    const k = Math.min(1, this.stateTime / (def.telegraphTime || (this.pat && this.pat.telegraph) || 0.6));
    switch (def.aiType) {
      case 'melee_chase':
        ctx.fillStyle = `rgba(255,60,60,${0.12 + 0.28 * k})`;
        ctx.beginPath(); ctx.arc(x, y, def.attackRange, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,90,90,0.9)'; ctx.stroke(); break;
      case 'ranged_kite':
        ctx.strokeStyle = `rgba(255,90,90,${0.2 + 0.6 * k})`;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(this.aimAng) * 140, y + Math.sin(this.aimAng) * 140); ctx.stroke(); break;
      case 'charger': {
        const len = def.dashSpeed * def.dashDuration;
        ctx.fillStyle = `rgba(255,60,60,${0.12 + 0.25 * k})`;
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(this.dashY, this.dashX));
        ctx.fillRect(0, -def.hitboxHalf, len, def.hitboxHalf * 2); ctx.restore(); break;
      }
      case 'caster':
        ctx.fillStyle = (def.bulletColor || '#c070ff') + '99';
        ctx.beginPath(); ctx.arc(x, y - 12, 2 + k * 5, 0, TAU); ctx.fill(); break;
      case 'exploder':
        ctx.fillStyle = `rgba(255,60,30,${0.1 + 0.3 * k})`;
        ctx.beginPath(); ctx.arc(x, y, def.explodeRadius, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,120,60,0.9)'; ctx.stroke(); break;
      case 'boss':
        if (this.pat.type === 'slam') {
          ctx.fillStyle = `rgba(255,50,50,${0.12 + 0.3 * k})`;
          ctx.beginPath(); ctx.arc(Math.round(this.pd.tx), Math.round(this.pd.ty), this.pat.radius, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(255,90,90,0.9)'; ctx.stroke();
        } else {
          ctx.strokeStyle = this.pat.color || '#fff'; ctx.globalAlpha = 0.3 + 0.6 * k;
          ctx.beginPath(); ctx.arc(x, y, 18 + k * 8, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
        }
        break;
    }
  }
  render(ctx) {
    if (this.state === 'SPAWN') return;
    const x = Math.round(this.x), y = Math.round(this.y), def = this.def;
    if (this.state === 'DEAD') {
      const dur = def.boss ? 1 : 0.35;
      const k = 1 - Math.min(1, this.stateTime / dur);
      ctx.globalAlpha = k; ctx.fillStyle = def.color || '#555';
      const w = def.hitboxHalf * 2 + 2;
      ctx.fillRect(x - w / 2, y + 1, w, Math.max(1, Math.round(4 * k)));
      ctx.globalAlpha = 1; return;
    }
    drawEnemy(ctx, this, x, y, this.hurtFlash > 0);
    const h = def.hitboxHalf;
    if (this.slow > 0) { ctx.fillStyle = 'rgba(140,210,255,0.35)'; ctx.fillRect(x - h - 1, y - h - 2, h * 2 + 2, h * 2 + 4); }
    if (this.burn > 0 && Math.floor(this.stateTime * 10) % 2 === 0) { ctx.fillStyle = '#ff8a3a'; ctx.fillRect(x - 2 + randInt(-3, 3), y - h - 3, 2, 2); }
    if (this.poison > 0) { ctx.fillStyle = '#9aff5a'; ctx.fillRect(x + h - 1, y - h - 3, 2, 2); }
    if (!def.boss && !def.dummy && this.hp < this.maxHp) {
      const w = h * 2 + 2;
      ctx.fillStyle = '#300'; ctx.fillRect(x - w / 2, y - h - 7, w, 2);
      ctx.fillStyle = '#e04848'; ctx.fillRect(x - w / 2, y - h - 7, Math.round(w * this.hp / this.maxHp), 2);
    }
  }
}

// ════════════════════════════════════════════
// 투사체
// ════════════════════════════════════════════
class Projectile {
  constructor(o) {
    Object.assign(this, o);
    this.pierceLeft = o.pierce || 0; this.radius = o.flame ? 5 : 2; this.traveled = 0; this.alive = true;
    this.bouncesLeft = o.bounce || 0;
    this.hitTargets = new Set();
  }
  update(dt, world) {
    if (!this.alive) return;
    this.age = (this.age || 0) + dt;
    if (this.mine && this.planted) { // 설치된 지뢰: 적이 가까이 오거나 시간이 다 되면 폭발
      this.mineLeft -= dt;
      if (this.mineLeft <= 0 || world.enemies.some((e) => e.targetable && !e.def.dummy && Math.hypot(e.x - this.x, e.y - this.y) < this.mine.trigger + e.radius)
        || (world.mode === 'lobby' && world.enemies.some((e) => e.targetable && Math.hypot(e.x - this.x, e.y - this.y) < this.mine.trigger + e.radius))) this.detonate(world);
      return;
    }
    if (this.homing) this.steer(dt, world);
    if (this.rehit) { this.rehitT = (this.rehitT ?? this.rehit) - dt; if (this.rehitT <= 0) { this.rehitT = this.rehit; this.hitTargets.clear(); } }
    if (this.pull) { // 공허: 주변 적을 끌어당김
      for (const e of world.enemies) {
        if (!e.targetable || e.def.dummy) continue;
        const ddx = this.x - e.x, ddy = this.y - e.y, d = Math.hypot(ddx, ddy);
        if (d < this.pull.radius && d > 4) { const k = this.pull.force * dt * (1 - (e.def.knockbackResist || 0)); moveAndCollide(e, ddx / d * k, ddy / d * k, world.map); }
      }
    }
    if (this.boomerang && (this.back || this.age > 4)) { // 부메랑 귀환: 벽 통과, 플레이어에게 돌아옴
      const p = world.player, ddx = p.x - this.x, ddy = p.y - this.y, d = Math.hypot(ddx, ddy);
      if (d < 10 || this.age > 6) { this.alive = false; return; }
      this.dx = ddx / d; this.dy = ddy / d;
      const st = Math.min(d, this.speed * 1.15 * dt), bx = this.x + this.dx * st, by = this.y + this.dy * st;
      for (const e of world.enemies) {
        if (!e.targetable || this.hitTargets.has(e.id)) continue;
        if (segmentCircleHit(this.x, this.y, bx, by, e.x, e.y, e.radius + this.radius) >= 0) { this.hitTargets.add(e.id); world.damageEnemy(e, this, this.dx, this.dy); }
      }
      this.x = bx; this.y = by; return;
    }
    let dist = this.speed * dt, endByRange = false;
    if (this.traveled + dist >= this.range) { dist = this.range - this.traveled; endByRange = true; }
    const sx = this.x, sy = this.y, ex = sx + this.dx * dist, ey = sy + this.dy * dist;
    const wallT = sweepWall(sx, sy, ex, ey, world.map);
    const limitT = wallT >= 0 ? wallT : 1;

    const hits = [];
    for (const e of world.enemies) {
      if (!e.targetable || this.hitTargets.has(e.id)) continue;
      const t = segmentCircleHit(sx, sy, ex, ey, e.x, e.y, e.radius + this.radius);
      if (t >= 0 && t <= limitT) hits.push({ e, t });
    }
    hits.sort((a, b) => a.t - b.t);
    for (const { e, t } of hits) {
      if (this.explodeRadius && !this.mine) {
        this.x = sx + (ex - sx) * t; this.y = sy + (ey - sy) * t; this.detonate(world); return;
      }
      this.hitTargets.add(e.id);
      world.damageEnemy(e, this, this.dx, this.dy);
      if (this.pierceLeft <= 0) {
        this.x = sx + (ex - sx) * t; this.y = sy + (ey - sy) * t; this.alive = false; this.end(world);
        if (!this.flame) world.effects.spark(this.x, this.y, '#ffffff'); return;
      }
      this.pierceLeft--;
    }
    if (wallT >= 0) {
      const px = sx + (ex - sx) * wallT, py = sy + (ey - sy) * wallT;
      if (this.mine) { this.x = px - this.dx * 4; this.y = py - this.dy * 4; this.planted = true; this.mineLeft = this.mine.life; return; }
      if (this.explodeRadius) { this.x = px; this.y = py; this.detonate(world); return; }
      if (this.boomerang) { this.x = px - this.dx * 2; this.y = py - this.dy * 2; this.back = true; this.hitTargets.clear(); return; }
      if (this.bouncesLeft > 0) {
        this.bouncesLeft--;
        const hx = world.map.isSolidAt(px + this.dx * 3, py), hy = world.map.isSolidAt(px, py + this.dy * 3);
        if (hx) this.dx = -this.dx;
        if (hy) this.dy = -this.dy;
        if (!hx && !hy) { this.dx = -this.dx; this.dy = -this.dy; }
        this.x = px; this.y = py; this.traveled += dist * wallT;
        this.hitTargets.clear();
        world.effects.spark(px, py, this.color);
        return;
      }
      this.x = px - this.dx * 3; this.y = py - this.dy * 3; this.alive = false; this.end(world);
      if (!this.flame) world.effects.spark(this.x, this.y, this.color); return;
    }
    this.x = ex; this.y = ey; this.traveled += dist;
    if (endByRange) {
      if (this.boomerang) { this.back = true; this.hitTargets.clear(); }
      else if (this.mine) { this.planted = true; this.mineLeft = this.mine.life; }
      else if (this.explodeRadius) this.detonate(world);
      else { this.alive = false; this.end(world); }
    }
  }
  // 소멸 시 파편 분열
  end(world) {
    if (!this.split) return;
    const S = this.split, a0 = Math.random() * TAU;
    for (let i = 0; i < S.count; i++) {
      const a = a0 + i * TAU / S.count;
      world.projectiles.push(new Projectile({ x: this.x, y: this.y, dx: Math.cos(a), dy: Math.sin(a), speed: S.speed, range: S.range,
        damage: S.damage, pierce: 0, knockback: 1, mods: this.mods, color: this.color, size: 1, explodeRadius: S.explode || 0 }));
    }
    world.effects.burst(this.x, this.y, this.color, 6);
  }
  steer(dt, world) {
    let best = null, bestD = 170;
    for (const e of world.enemies) {
      if (!e.targetable || e.def.dummy && world.mode !== 'lobby') continue;
      const d = Math.hypot(e.x - this.x, e.y - this.y);
      if (d < bestD) { best = e; bestD = d; }
    }
    if (!best) return;
    const cur = Math.atan2(this.dy, this.dx), want = Math.atan2(best.y - this.y, best.x - this.x);
    let diff = want - cur;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    const ang = cur + clamp(diff, -this.homing * dt, this.homing * dt);
    this.dx = Math.cos(ang); this.dy = Math.sin(ang);
  }
  detonate(world) {
    this.alive = false;
    world.explodeAt(this.x, this.y, this.explodeRadius, { src: this, color: this.color, hurtEnemies: true });
    this.end(world);
  }
  render(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y), s = this.size || 1;
    if (this.mine && this.planted) {
      ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5a5a3a'; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = Math.floor(this.age * (this.mineLeft < 1.5 ? 12 : 3)) % 2 ? '#ff3a2a' : '#5a1a1a'; ctx.fillRect(x - 1, y - 1, 2, 2);
      return;
    }
    if (this.spriteDef) { // 회전하는 투척물
      const sp = weaponSprite(this.spriteDef);
      ctx.save(); ctx.translate(x, y); ctx.rotate((this.age || 0) * 18); ctx.drawImage(sp.n, -sp.w / 2, -sp.h / 2); ctx.restore(); return;
    }
    if (this.pull) { // 공허 구체
      ctx.strokeStyle = this.color; ctx.globalAlpha = 0.25;
      const a = (this.age || 0) * 6;
      ctx.beginPath(); ctx.arc(x, y, this.pull.radius * 0.6, a, a + 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, this.pull.radius * 0.4, -a, -a + 2); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = '#1a0a2a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
      ctx.strokeStyle = this.color; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.stroke(); return;
    }
    if (this.flame) {
      const k = this.traveled / this.range;
      ctx.globalAlpha = 0.8 * (1 - k);
      ctx.fillStyle = k < 0.3 ? '#ffe36b' : k < 0.6 ? this.color : '#a03a1a';
      const r = 2 + k * 6; ctx.fillRect(Math.round(x - r), Math.round(y - r), Math.round(r * 2), Math.round(r * 2));
      ctx.globalAlpha = 1; return;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(Math.round(x - this.dx * 4), Math.round(y - this.dy * 4), 2, 2);
    if (this.arrow) {
      ctx.strokeStyle = this.color; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - this.dx * 8, y - this.dy * 8); ctx.stroke();
    }
    ctx.fillStyle = this.color; ctx.fillRect(x - s, y - s, s * 2 + 1, s * 2 + 1);
  }
}

class EnemyBullet {
  constructor(x, y, vx, vy, damage, color, r) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.damage = damage;
    this.color = color; this.r = r; this.alive = true; this.life = 6;
  }
  update(dt, world) {
    this.life -= dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.life <= 0) { this.alive = false; return; }
    if (world.map.isSolidAt(this.x, this.y)) { this.alive = false; world.effects.spark(this.x, this.y, this.color); return; }
    const p = world.player;
    if (p.state !== 'DEAD' && Math.abs(p.x - this.x) < p.half + this.r - 1 && Math.abs(p.y - this.y) < p.half + this.r - 1) {
      if (world.damagePlayer(this.damage)) { this.alive = false; world.effects.spark(this.x, this.y, '#fff'); }
    }
  }
  render(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y);
    ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(x, y, this.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2);
  }
}

// 지연 폭발 장판 (보스 패턴)
class Hazard {
  constructor(x, y, o) { Object.assign(this, o); this.x = x; this.y = y; this.t = 0; this.alive = true; }
  update(dt, world) {
    this.t += dt;
    if (this.t < this.delay) return;
    this.alive = false;
    const p = world.player;
    if (p.state !== 'DEAD' && Math.hypot(p.x - this.x, p.y - this.y) < this.r + p.half) world.damagePlayer(this.damage);
    world.effects.explosion(this.x, this.y, this.r, this.color);
    for (let i = 0; i < this.bullets; i++)
      world.enemyShoot(this.x, this.y, i * TAU / this.bullets + Math.random() * 0.3, 110, Math.round(this.damage * 0.7), this.color, 3);
    world.addShake(0.08, 2);
  }
  render(ctx) {
    if (this.t < 0) return;
    const k = clamp(this.t / this.delay, 0, 1), x = Math.round(this.x), y = Math.round(this.y);
    ctx.fillStyle = `rgba(255,60,40,${0.1 + 0.25 * k})`; ctx.beginPath(); ctx.arc(x, y, this.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = this.color; ctx.beginPath(); ctx.arc(x, y, this.r * k, 0, TAU); ctx.stroke();
  }
}

// 기술자 포탑
class Turret {
  constructor(x, y, owner) { this.x = x; this.y = y; this.owner = owner; this.life = 12; this.cd = 0.3; this.ang = 0; this.alive = true; }
  update(dt, world) {
    this.life -= dt; this.cd -= dt;
    if (this.life <= 0) { this.alive = false; world.effects.burst(this.x, this.y, '#aaa', 6); return; }
    let best = null, bestD = 220;
    for (const e of world.enemies) {
      if (!e.targetable) continue;
      const d = Math.hypot(e.x - this.x, e.y - this.y);
      if (d < bestD && hasLineOfSight(this, e, world.map)) { best = e; bestD = d; }
    }
    if (!best) return;
    this.ang = Math.atan2(best.y - this.y, best.x - this.x);
    if (this.cd <= 0) {
      this.cd = 0.2;
      world.projectiles.push(new Projectile({ x: this.x, y: this.y - 3, dx: Math.cos(this.ang), dy: Math.sin(this.ang),
        speed: 380, range: 260, damage: 8, pierce: 0, knockback: 1, mods: this.owner.mods, color: '#ffe36b', size: 1 }));
    }
  }
  render(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y);
    if (this.life < 2 && Math.floor(this.life * 10) % 2 === 0) return;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x - 6, y + 4, 12, 2);
    ctx.fillStyle = '#5a5a6a'; ctx.fillRect(x - 6, y - 2, 12, 7);
    ctx.fillStyle = '#c08a30'; ctx.fillRect(x - 4, y - 6, 8, 5);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - 3); ctx.lineTo(x + Math.cos(this.ang) * 9, y - 3 + Math.sin(this.ang) * 9); ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// ════════════════════════════════════════════
// 무기 시스템
// ════════════════════════════════════════════
class WeaponInstance {
  constructor(def) { this.def = def; this.cooldown = 0; this.charge = 0; this.burstLeft = 0; this.burstTimer = 0; this.beamTick = 0; this.beamActive = false; this.beamEnd = null; }
}

class WeaponSystem {
  constructor(world) { this.world = world; this.noEnergyMsgT = 0; }
  noEnergy(player) {
    if (this.noEnergyMsgT <= 0) { this.world.effects.text(player.x, player.y - 18, '에너지 부족', '#7fb0ff'); this.noEnergyMsgT = 0.8; }
  }
  spend(player, cost) {
    if (player.overdrive > 0 || !cost) return true;
    if (player.energy < cost) { this.noEnergy(player); return false; }
    player.energy -= cost; return true;
  }
  getFireRate(player, w) { return w.def.fireRate * (1 + player.stats.fireRateBonus + (player.overdrive > 0 ? 1 : 0)) * (w.def.spinUp ? 0.25 + 0.75 * Math.min(1, (w.spin || 0) / w.def.spinUp) : 1); }
  update(player, dt, input) {
    this.noEnergyMsgT = Math.max(0, this.noEnergyMsgT - dt);
    const w = player.weapon;
    for (const o of player.weapons) if (o !== w) { o.cooldown = Math.max(0, o.cooldown - dt); o.charge = 0; o.beamActive = false; o.burstLeft = 0; }
    if (!w) return;
    w.cooldown = Math.max(w.cooldown - dt, -STEP);
    if (player.state === 'DEAD') { w.beamActive = false; w.charge = 0; return; }
    if ((input.wasPressed('KeyQ') || input.wasPressed('Wheel')) && player.weapons.length > 1) {
      w.charge = 0; w.beamActive = false; w.burstLeft = 0;
      player.slot = (player.slot + 1) % player.weapons.length;
      player.weapon.cooldown = Math.max(player.weapon.cooldown, 0.15);
      return;
    }
    if (w.burstLeft > 0) {
      w.burstTimer -= dt;
      if (w.burstTimer <= 0) { this.shootGun(player, w); w.burstLeft--; w.burstTimer = w.def.burst.interval; }
    }
    const down = input.mouse.down;
    if (w.def.spinUp) w.spin = down ? Math.min(w.def.spinUp, (w.spin || 0) + dt) : 0; // 회전 기관총: 누를수록 연사 증가
    switch (w.def.type) {
      case 'gun': if (down && w.cooldown <= 0 && w.burstLeft === 0) this.fireGun(player, w); break;
      case 'melee': if (down && w.cooldown <= 0) this.fireMelee(player, w); break;
      case 'charge':
        if (down) {
          if (w.cooldown <= 0) {
            if (w.charge === 0 && player.overdrive <= 0 && player.energy < w.def.energyCost) this.noEnergy(player);
            else w.charge = Math.min(w.def.chargeTime, w.charge + dt * (1 + player.stats.fireRateBonus + (player.overdrive > 0 ? 1 : 0)));
          }
        } else if (w.charge > 0) this.releaseCharge(player, w);
        break;
      case 'beam': this.updateBeam(player, w, dt, down); break;
    }
    if (!down) w.cooldown = Math.max(w.cooldown, 0);
  }
  fireGun(player, w) {
    if (!this.spend(player, w.def.energyCost)) return;
    w.cooldown += 1 / this.getFireRate(player, w);
    this.shootGun(player, w);
    if (w.def.burst) { w.burstLeft = w.def.burst.count - 1; w.burstTimer = w.def.burst.interval; }
  }
  shootGun(player, w, override = {}) {
    const def = w.def;
    const base = Math.atan2(player.aim.y, player.aim.x);
    const spread = (def.spreadDeg || 0) * Math.PI / 180;
    const n = def.projectileCount || 1;
    for (let i = 0; i < n; i++) {
      let ang = base + (Math.random() * 2 - 1) * spread;
      if (def.fanDeg && n > 1) ang = base + (i / (n - 1) - 0.5) * def.fanDeg * Math.PI / 180;
      if (def.parallel) ang = base + (Math.random() * 2 - 1) * spread;
      const off = def.parallel ? (i - (n - 1) / 2) * def.parallel : 0;
      this.world.projectiles.push(new Projectile(Object.assign({
        x: player.x - Math.sin(base) * off, y: player.y - 1 + Math.cos(base) * off, dx: Math.cos(ang), dy: Math.sin(ang),
        boomerang: !!def.boomerang, split: def.split || null, pull: def.pull || null, rehit: def.rehit || 0, mine: def.mine || null,
        spriteDef: def.boomerang || def.spinSprite ? def : null,
        speed: def.projectileSpeed, range: def.range, damage: def.damage,
        pierce: def.pierce, knockback: def.knockback || 0,
        mods: def.critBonus ? Object.assign(player.mods, { critChance: player.stats.critChance + def.critBonus }) : player.mods,
        explodeRadius: def.explodeRadius || 0, color: def.bulletColor, size: def.bulletSize || 1,
        homing: def.homing || 0, bounce: def.bounce || 0, chain: def.chain || null, status: def.status || null, flame: !!def.flame
      }, override)));
    }
    if (!def.flame) this.world.effects.spark(player.x + player.aim.x * (def.len + 4), player.y - 1 + player.aim.y * (def.len + 4), '#fff6c0');
  }
  releaseCharge(player, w) {
    const def = w.def, k = 0.3 + 0.7 * Math.min(1, w.charge / def.chargeTime), full = w.charge >= def.chargeTime;
    w.charge = 0;
    if (!this.spend(player, def.energyCost)) return;
    w.cooldown = 1 / this.getFireRate(player, w);
    this.shootGun(player, w, { damage: def.damage * k, speed: def.projectileSpeed * (0.6 + 0.4 * k),
      pierce: full ? def.pierce : 0, arrow: true, size: full ? 2 : 1 });
  }
  fireMelee(player, w) {
    const def = w.def, world = this.world;
    if (!this.spend(player, def.energyCost)) return;
    w.cooldown += 1 / this.getFireRate(player, w);
    const ang = Math.atan2(player.aim.y, player.aim.x), arc = def.arcDeg * Math.PI / 180;
    const src = { damage: def.damage, mods: player.mods, knockback: def.knockback, status: def.status || null };
    let hits = 0;
    for (const e of world.enemies) {
      if (!e.targetable) continue;
      const dx = e.x - player.x, dy = e.y - player.y, d = Math.hypot(dx, dy);
      if (d - e.radius > def.range) continue;
      if (d > 4 && angleDiff(Math.atan2(dy, dx), ang) > arc / 2 + Math.atan2(e.radius, d)) continue;
      world.damageEnemy(e, src, dx / (d || 1), dy / (d || 1)); hits++;
    }
    if (def.lifesteal && hits > 0) player.hp = Math.min(player.maxHp, player.hp + Math.min(3, hits * def.lifesteal));
    if (def.deflect) {
      for (const b of world.enemyBullets) {
        const dx = b.x - player.x, dy = b.y - player.y, d = Math.hypot(dx, dy);
        if (d <= def.range + 6 && angleDiff(Math.atan2(dy, dx), ang) <= arc / 2 + 0.2) { b.alive = false; world.effects.spark(b.x, b.y, '#ffffff'); }
      }
    }
    const thrust = def.arcDeg < 40;
    player.swing = { t: 0, dur: thrust ? 0.15 : 0.16, ang, arc, thrust };
    world.effects.slash(player.x, player.y - 1, ang, def.range, arc, thrust ? '#e0f0ff' : 'rgba(230,240,255,0.9)');
    if (def.shake) world.addShake(0.1, 3);
  }
  updateBeam(player, w, dt, down) {
    const def = w.def, world = this.world;
    if (!down) { w.beamActive = false; return; }
    if (player.overdrive <= 0) {
      if (player.energy <= 0) { w.beamActive = false; this.noEnergy(player); return; }
      player.energy = Math.max(0, player.energy - def.energyPerSec * dt);
    }
    w.beamActive = true;
    const sx = player.x + player.aim.x * 10, sy = player.y - 1 + player.aim.y * 10;
    let ex = sx + player.aim.x * def.range, ey = sy + player.aim.y * def.range;
    const wt = sweepWall(sx, sy, ex, ey, world.map);
    let limit = wt >= 0 ? wt : 1, target = null;
    for (const e of world.enemies) {
      if (!e.targetable) continue;
      const t = segmentCircleHit(sx, sy, ex, ey, e.x, e.y, e.radius + 2);
      if (t >= 0 && t <= limit) { limit = t; target = e; }
    }
    w.beamEnd = { sx, sy, x: sx + (ex - sx) * limit, y: sy + (ey - sy) * limit };
    w.beamTick -= dt;
    if (w.beamTick <= 0) {
      w.beamTick = def.tickRate / (1 + player.stats.fireRateBonus);
      if (target) world.damageEnemy(target, { damage: def.damage, mods: player.mods, knockback: 0 }, player.aim.x, player.aim.y, { quiet: true });
    }
  }
}

// ════════════════════════════════════════════
// 몬스터 AI
// ════════════════════════════════════════════
function chaseStep(e, tx, ty, speed, dt, map) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d < 0.01) return;
  moveAndCollide(e, dx / d * speed * dt, dy / d * speed * dt, map);
}
function hasClearPath(e, p, map) {
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  const ox = -dy / d * (e.half + 2), oy = dx / d * (e.half + 2); // 몸통보다 약간 넓게 → 모서리 스침 방지
  for (const k of [0, -1, 1])
    if (sweepWall(e.x + ox * k, e.y + oy * k, p.x + ox * k, p.y + oy * k, map, 6) >= 0) return false;
  return true;
}
// 직선 경로가 막히면 플로우 필드(BFS 거리맵)를 따라 장애물을 돌아감
function pathStep(e, speed, dt, world) {
  const p = world.player, map = world.map;
  // 1초 동안 거의 못 움직였으면 0.5초간 방 중앙 쪽으로 빠져나옴
  e.stuckCheck = (e.stuckCheck || 0) + dt;
  if (e.stuckCheck >= 1) {
    if (Math.hypot(e.x - (e.sx0 ?? e.x + 99), e.y - (e.sy0 ?? 0)) < 1.5 && speed > 0) e.unstuck = 0.4;
    e.sx0 = e.x; e.sy0 = e.y; e.stuckCheck = 0;
  }
  if (e.unstuck > 0 && e.room) {
    e.unstuck -= dt;
    const c = map.tileCenter(e.room.cx, e.room.cy);
    chaseStep(e, c.x + (e.id % 3 - 1) * 24, c.y + (e.id % 2 ? 20 : -20), speed, dt, map); return;
  }
  if (hasClearPath(e, p, map)) { chaseStep(e, p.x, p.y, speed, dt, map); return; }
  const flow = world.flow, W = map.width;
  const tx = Math.floor(e.x / TILE), ty = Math.floor(e.y / TILE);
  const here = flow[ty * W + tx];
  let best = null, bestD = here >= 0 ? here : 1e9;
  for (const [ddx, ddy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const v = flow[(ty + ddy) * W + tx + ddx];
    if (v >= 0 && v < bestD) { bestD = v; best = [tx + ddx, ty + ddy]; }
  }
  if (!best) { chaseStep(e, p.x, p.y, speed, dt, map); return; }
  // 축 분리 이동: 진행 방향의 수직축을 먼저 타일 중앙에 맞춘 뒤 전진 → 모서리에 걸리지 않음
  const c = map.tileCenter(best[0], best[1]), step = speed * dt;
  const toward = (v, t) => clamp(t - v, -step, step);
  if (best[0] !== tx) {
    if (Math.abs(e.y - c.y) > 0.001) moveAndCollide(e, 0, toward(e.y, c.y), map);
    else moveAndCollide(e, toward(e.x, c.x), 0, map);
  } else {
    if (Math.abs(e.x - c.x) > 0.001) moveAndCollide(e, toward(e.x, c.x), 0, map);
    else moveAndCollide(e, 0, toward(e.y, c.y), map);
  }
}

const AI_BEHAVIORS = {
  dummy() {},

  melee_chase(e, dt, world, ctx) {
    const def = e.def, p = world.player;
    const inRange = ctx.dist <= def.attackRange + p.radius;
    switch (e.state) {
      case 'IDLE': if (ctx.playerAlive) e.setState('CHASE'); break;
      case 'CHASE':
        if (!ctx.playerAlive) { e.setState('IDLE'); break; }
        if (inRange && e.attackCd <= 0) { e.setState('TELEGRAPH'); break; }
        if (ctx.dist > def.attackRange * 0.6) pathStep(e, def.moveSpeed, dt, world);
        break;
      case 'TELEGRAPH': if (e.stateTime >= def.telegraphTime) e.setState('ATTACK'); break;
      case 'ATTACK':
        if (ctx.playerAlive && inRange) world.damagePlayer(e.damage);
        world.effects.ring(e.x, e.y, def.attackRange, '#ff7070');
        e.attackCd = def.attackCooldown; e.setState('RECOVERY');
        break;
      case 'RECOVERY': if (e.stateTime >= def.recoveryTime) e.setState(ctx.playerAlive ? 'CHASE' : 'IDLE'); break;
    }
  },

  ranged_kite(e, dt, world, ctx) {
    const def = e.def, p = world.player, map = world.map;
    switch (e.state) {
      case 'IDLE': if (ctx.playerAlive) e.setState('CHASE'); break;
      case 'CHASE': {
        if (!ctx.playerAlive) { e.setState('IDLE'); break; }
        if (!hasLineOfSight(e, p, map)) { pathStep(e, def.moveSpeed, dt, world); break; }
        e.strafeT -= dt;
        if (e.strafeT <= 0) { e.strafe *= -1; e.strafeT = 1.2 + Math.random() * 1.8; }
        const nx = ctx.dx / ctx.dist, ny = ctx.dy / ctx.dist;
        let mx = 0, my = 0;
        if (ctx.dist > def.preferredRange + 25) { mx = nx; my = ny; }
        else if (ctx.dist < def.preferredRange - 35) { mx = -nx; my = -ny; }
        mx += -ny * e.strafe * 0.7; my += nx * e.strafe * 0.7;
        const ml = Math.hypot(mx, my) || 1;
        const hit = moveAndCollide(e, mx / ml * def.moveSpeed * dt, my / ml * def.moveSpeed * dt, map);
        if (hit.x || hit.y) e.strafe *= -1;
        if (e.attackCd <= 0 && ctx.dist < def.attackRange) { e.aimAng = Math.atan2(ctx.dy, ctx.dx); e.setState('TELEGRAPH'); }
        break;
      }
      case 'TELEGRAPH':
        if (e.stateTime < def.telegraphTime - 0.15) e.aimAng = Math.atan2(ctx.dy, ctx.dx);
        if (e.stateTime >= def.telegraphTime) {
          const n = def.bulletCount || 1, sp = def.bulletSpread || 0;
          for (let i = 0; i < n; i++)
            world.enemyShoot(e.x, e.y, e.aimAng + (n > 1 ? (i / (n - 1) - 0.5) * sp * (n - 1) : 0), def.bulletSpeed, e.damage, def.bulletColor || '#ff6a4a', 3);
          e.attackCd = def.attackCooldown + Math.random() * 0.6;
          e.setState('RECOVERY');
        }
        break;
      case 'RECOVERY': if (e.stateTime >= def.recoveryTime) e.setState(ctx.playerAlive ? 'CHASE' : 'IDLE'); break;
    }
  },

  charger(e, dt, world, ctx) {
    const def = e.def, p = world.player, map = world.map;
    switch (e.state) {
      case 'IDLE': if (ctx.playerAlive) e.setState('CHASE'); break;
      case 'CHASE':
        if (!ctx.playerAlive) { e.setState('IDLE'); break; }
        pathStep(e, def.moveSpeed, dt, world);
        if (e.attackCd <= 0 && ctx.dist < def.attackRange && hasLineOfSight(e, p, map)) {
          e.dashX = ctx.dx / ctx.dist; e.dashY = ctx.dy / ctx.dist; e.setState('TELEGRAPH');
        }
        break;
      case 'TELEGRAPH': if (e.stateTime >= def.telegraphTime) { e.dashHit = false; e.setState('ATTACK'); } break;
      case 'ATTACK': {
        const hit = moveAndCollide(e, e.dashX * def.dashSpeed * dt, e.dashY * def.dashSpeed * dt, map);
        if (!e.dashHit && ctx.playerAlive && Math.hypot(p.x - e.x, p.y - e.y) < e.radius + p.half + 3)
          if (world.damagePlayer(e.damage)) e.dashHit = true;
        if (hit.x || hit.y) {
          world.effects.spark(e.x + e.dashX * 8, e.y + e.dashY * 8, '#ffe08a'); world.addShake(0.1, 2);
          e.attackCd = def.attackCooldown; e.setState('STUN'); break;
        }
        if (e.stateTime >= def.dashDuration) { e.attackCd = def.attackCooldown; e.setState('RECOVERY'); }
        break;
      }
      case 'STUN': if (e.stateTime >= def.stunTime) e.setState('CHASE'); break;
      case 'RECOVERY': if (e.stateTime >= def.recoveryTime) e.setState(ctx.playerAlive ? 'CHASE' : 'IDLE'); break;
    }
  },

  caster(e, dt, world, ctx) {
    const def = e.def, p = world.player, map = world.map;
    switch (e.state) {
      case 'IDLE': if (ctx.playerAlive) e.setState('CHASE'); break;
      case 'CHASE':
        if (!ctx.playerAlive) { e.setState('IDLE'); break; }
        e.strafeT -= dt;
        if (e.strafeT <= 0) { e.strafe *= -1; e.strafeT = 2 + Math.random() * 2; }
        if (ctx.dist > 180 || !hasLineOfSight(e, p, map)) pathStep(e, def.moveSpeed, dt, world);
        else moveAndCollide(e, -ctx.dy / ctx.dist * e.strafe * def.moveSpeed * dt, ctx.dx / ctx.dist * e.strafe * def.moveSpeed * dt, map);
        if (e.attackCd <= 0 && ctx.dist < def.attackRange) e.setState('TELEGRAPH');
        break;
      case 'TELEGRAPH':
        if (e.stateTime >= def.telegraphTime) {
          e.spin += 0.35;
          for (let i = 0; i < def.bulletCount; i++)
            world.enemyShoot(e.x, e.y - 4, e.spin + i * TAU / def.bulletCount, def.bulletSpeed, e.damage, def.bulletColor || '#c070ff', 3);
          e.attackCd = def.attackCooldown; e.setState('RECOVERY');
        }
        break;
      case 'RECOVERY': if (e.stateTime >= def.recoveryTime) e.setState(ctx.playerAlive ? 'CHASE' : 'IDLE'); break;
    }
  },

  // 자폭병: 붙으면 점멸 후 폭발 (처치당해도 폭발)
  exploder(e, dt, world, ctx) {
    const def = e.def;
    switch (e.state) {
      case 'IDLE': if (ctx.playerAlive) e.setState('CHASE'); break;
      case 'CHASE':
        if (!ctx.playerAlive) { e.setState('IDLE'); break; }
        pathStep(e, def.moveSpeed, dt, world);
        if (ctx.dist < 26) e.setState('TELEGRAPH');
        break;
      case 'TELEGRAPH':
        if (e.stateTime >= def.telegraphTime) {
          e.alive = false; e.rewardGiven = true; e.setState('DEAD');
          world.enemyExplode(e);
        }
        break;
    }
  },

  // 보스: 데이터에 정의된 패턴 목록을 돌아가며 사용, 체력 50% 이하 격노
  boss(e, dt, world, ctx) {
    const def = e.def, p = world.player;
    const enr = e.hp < e.maxHp * 0.5 ? 1.4 : 1;
    switch (e.state) {
      case 'IDLE': if (ctx.playerAlive) e.setState('CHASE'); break;
      case 'CHASE':
        if (!ctx.playerAlive) break;
        if (ctx.dist > 50) pathStep(e, def.moveSpeed * enr, dt, world);
        if (e.stateTime >= def.attackCooldown / enr) {
          const opts = def.patterns.filter((x) => x !== e.lastPat);
          e.pat = pick(opts); e.lastPat = e.pat; e.pd = { shots: 0, timer: 0 };
          const P = BOSS_PATTERNS[e.pat.type];
          if (P.begin) P.begin(e, world, ctx);
          e.setState('TELEGRAPH');
        }
        break;
      case 'TELEGRAPH':
        if (e.stateTime >= (e.pat.telegraph || (e.pat.type === 'slam' ? 0.8 : 0.5)) / enr) { e.pd.sx = e.x; e.pd.sy = e.y; e.setState('ATTACK'); }
        break;
      case 'ATTACK':
        if (BOSS_PATTERNS[e.pat.type].update(e, dt, world, ctx, enr)) e.setState('RECOVERY');
        break;
      case 'RECOVERY': if (e.stateTime >= 0.6 / enr) e.setState('CHASE'); break;
    }
  }
};

// update()가 true를 돌려주면 패턴 종료
const BOSS_PATTERNS = {
  radial: {
    update(e, dt, world, ctx, enr) {
      const P = e.pat, d = e.pd; d.timer -= dt;
      if (d.timer <= 0 && d.shots < P.rings) {
        const off = d.shots * (Math.PI / P.count);
        for (let i = 0; i < P.count; i++) world.enemyShoot(e.x, e.y, off + i * TAU / P.count, e.def.bulletSpeed, e.damage, P.color, 4);
        d.shots++; d.timer = 0.3 / enr;
      }
      return d.shots >= P.rings && d.timer <= 0;
    }
  },
  aimed: {
    update(e, dt, world, ctx, enr) {
      const P = e.pat, d = e.pd, p = world.player; d.timer -= dt;
      if (d.timer <= 0 && d.shots < P.volleys) {
        const base = Math.atan2(p.y - e.y, p.x - e.x), h = (P.count - 1) / 2;
        for (let i = 0; i < P.count; i++) world.enemyShoot(e.x, e.y, base + (i - h) * P.spread, e.def.bulletSpeed * 1.4, e.damage, P.color, 3);
        d.shots++; d.timer = 0.32 / enr;
      }
      return d.shots >= P.volleys && d.timer <= 0;
    }
  },
  summon: {
    update(e, dt, world) {
      const alive = world.enemies.filter((x) => x.alive).length;
      for (let i = 0; i < e.pat.count && alive + i < 8; i++) {
        const a = Math.random() * TAU;
        const pt = world.findSpawnPoint(e.room, 0, e.x + Math.cos(a) * 40, e.y + Math.sin(a) * 40);
        world.spawnEnemy(e.pat.enemyId, pt.x, pt.y, e.room);
      }
      return true;
    }
  },
  slam: {
    begin(e, world) {
      const r = e.room, m = e.def.hitboxHalf + 2, p = world.player;
      e.pd.tx = clamp(p.x, r.x0 * TILE + m, (r.x0 + r.w) * TILE - m);
      e.pd.ty = clamp(p.y, r.y0 * TILE + m, (r.y0 + r.h) * TILE - m);
    },
    update(e, dt, world, ctx) {
      const d = e.pd, P = e.pat, t = Math.min(1, e.stateTime / 0.5);
      e.x = d.sx + (d.tx - d.sx) * t; e.y = d.sy + (d.ty - d.sy) * t;
      e.jumpH = Math.sin(t * Math.PI) * 40;
      if (t < 1) return false;
      e.jumpH = 0;
      const p = world.player;
      if (ctx.playerAlive && Math.hypot(p.x - e.x, p.y - e.y) < P.radius + p.half) world.damagePlayer(Math.round(e.damage * 1.5));
      for (let i = 0; i < 14; i++) world.enemyShoot(e.x, e.y, i * TAU / 14, e.def.bulletSpeed * 0.9, e.damage, P.color, 4);
      world.effects.ring(e.x, e.y, P.radius, P.color); world.effects.ring(e.x, e.y, P.radius * 0.7, '#ffffff');
      world.addShake(0.25, 5);
      return true;
    }
  },
  charge: {
    begin(e) { e.pd.n = 0; e.pd.phase = 'aim'; e.pd.pt = 0; },
    update(e, dt, world, ctx, enr) {
      const d = e.pd, P = e.pat, p = world.player;
      d.pt += dt;
      if (d.phase === 'aim') {
        e.dashX = ctx.dx / ctx.dist; e.dashY = ctx.dy / ctx.dist;
        if (d.pt >= 0.45 / enr) { d.phase = 'dash'; d.pt = 0; e.dashHit = false; }
        return false;
      }
      const hit = moveAndCollide(e, e.dashX * P.speed * dt, e.dashY * P.speed * dt, world.map);
      if (!e.dashHit && ctx.playerAlive && Math.hypot(p.x - e.x, p.y - e.y) < e.radius + p.half + 3)
        if (world.damagePlayer(Math.round(e.damage * 1.2))) e.dashHit = true;
      if (hit.x || hit.y || d.pt > 0.9) {
        if (hit.x || hit.y) {
          world.addShake(0.2, 4);
          for (let i = 0; i < 10; i++) world.enemyShoot(e.x, e.y, i * TAU / 10 + Math.random() * 0.3, e.def.bulletSpeed, e.damage, P.color, 3);
        }
        d.n++; d.phase = 'aim'; d.pt = 0;
      }
      return d.n >= P.dashes;
    }
  },
  zones: {
    update(e, dt, world) {
      const P = e.pat, p = world.player;
      for (let i = 0; i < P.count; i++) {
        const a = Math.random() * TAU, r = i === 0 ? 0 : 20 + Math.random() * P.spreadAround;
        const x = clamp(p.x + Math.cos(a) * r, e.room.x0 * TILE + 8, (e.room.x0 + e.room.w) * TILE - 8);
        const y = clamp(p.y + Math.sin(a) * r, e.room.y0 * TILE + 8, (e.room.y0 + e.room.h) * TILE - 8);
        world.hazards.push(new Hazard(x, y, { r: P.radius, delay: P.delay, damage: Math.round(e.damage * 1.1),
          bullets: P.bullets, color: P.color }));
        if (P.stagger) world.hazards[world.hazards.length - 1].t = -i * P.stagger;
      }
      return true;
    }
  },
  spiral: {
    update(e, dt, world, ctx, enr) {
      const P = e.pat, d = e.pd; d.timer -= dt;
      d.a = (d.a || 0) + P.spin * dt * enr;
      while (d.timer <= 0) {
        for (let i = 0; i < P.arms; i++) world.enemyShoot(e.x, e.y, d.a + i * TAU / P.arms, e.def.bulletSpeed * 0.9, e.damage, P.color, 3);
        d.timer += P.interval;
      }
      return e.stateTime >= P.duration;
    }
  }
};

function updateEnemy(e, dt, world) {
  e.hurtFlash = Math.max(0, e.hurtFlash - dt);
  if (e.state === 'DEAD') {
    e.stateTime += dt;
    if (e.stateTime >= (e.def.boss ? 1 : 0.35)) e.removed = true;
    return;
  }
  if (e.state === 'SPAWN') { e.stateTime += dt; if (e.stateTime >= SPAWN_TIME) e.setState('CHASE'); return; }
  // 상태이상
  e.burn = Math.max(0, e.burn - dt); e.poison = Math.max(0, e.poison - dt); e.slow = Math.max(0, e.slow - dt);
  if (e.burn > 0 || e.poison > 0) {
    e.dotTimer -= dt;
    if (e.dotTimer <= 0) {
      e.dotTimer = 0.5;
      if (e.burn > 0) world.dotDamage(e, e.burnDps * 0.5, '#ff9a4a');
      if (e.poison > 0 && e.alive) world.dotDamage(e, e.poisonDps * 0.5, '#9aff5a');
      if (!e.alive) return;
    }
  }
  const sdt = dt * e.speedMul; // 빙결 시 이동/행동 모두 느려짐
  e.stateTime += sdt;
  const p = world.player;
  const dx = p.x - e.x, dy = p.y - e.y;
  const ctx = { dx, dy, dist: Math.hypot(dx, dy) || 0.001, playerAlive: p.state !== 'DEAD' };
  if (!(e.state === 'ATTACK' && e.def.aiType === 'charger')) e.face = dx < 0 ? -1 : 1;
  e.attackCd = Math.max(0, e.attackCd - sdt);
  const behavior = AI_BEHAVIORS[e.def.aiType];
  if (!behavior) throw new Error('알 수 없는 aiType: ' + e.def.aiType);
  behavior(e, sdt, world, ctx);
}

class Pickup {
  constructor(kind, x, y, o = {}) {
    this.kind = kind; this.x = x; this.y = y; this.half = 2; this.alive = true; this.t = Math.random() * 3;
    const a = Math.random() * TAU, s = o.still ? 0 : 40 + Math.random() * 60;
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.value = o.value || 1; this.def = o.def || null; this.delay = o.still ? 0 : 0.35;
  }
  get magnetic() { return this.kind !== 'weapon'; }
  update(dt, world) {
    this.t += dt; this.delay = Math.max(0, this.delay - dt);
    const p = world.player;
    if (this.magnetic && this.delay <= 0 && p.state !== 'DEAD') {
      const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy);
      if (d < 64) { const k = 260 * (1 - d / 80); this.vx += dx / d * k * dt * 6; this.vy += dy / d * k * dt * 6; }
      if (d < 9) { world.collect(this); this.alive = false; return; }
    }
    this.vx *= Math.pow(0.02, dt); this.vy *= Math.pow(0.02, dt);
    moveAndCollide(this, this.vx * dt, this.vy * dt, world.map);
  }
  render(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y), bob = Math.round(Math.sin(this.t * 4) * 1.5);
    switch (this.kind) {
      case 'coin': drawSprite(ctx, getSprite('coin'), x, y + 3 + bob); break;
      case 'energy':
        ctx.fillStyle = 'rgba(90,150,255,0.25)'; ctx.fillRect(x - 4, y - 4 + bob, 8, 8);
        drawSprite(ctx, getSprite('energy'), x, y + 4 + bob); break;
      case 'hp': drawPotion(ctx, x, y + bob, '#e04848'); break;
      case 'weapon':
        ctx.fillStyle = RARITY_COLOR[this.def.rarity]; ctx.globalAlpha = 0.25 + 0.15 * Math.sin(this.t * 3);
        ctx.beginPath(); ctx.arc(x, y + 3, 9, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
        drawWeaponCentered(ctx, this.def, x, y + bob); break;
    }
  }
}

  get name() { return this.kind === 'weapon' ? this.def.name : this.kind === 'hp' ? '체력 물약 (+40)' : '에너지 물약 (+120)'; }

class Pedestal {
  constructor(x, y, hero) { this.x = x; this.y = y; this.hero = hero; this.radius = 20; this.t = Math.random() * 3; }
  label(game) {
    const s = game.save;
    if (s.selected === this.hero.id) return null;
    if (s.unlocked.includes(this.hero.id)) return `[E] ${this.hero.name} 선택`;
    return `[E] 해금: ${this.hero.name} (${this.hero.price}골드)`;
  }
  get labelColor() { return '#ffffff'; }
  interact(game) { game.selectHero(this.hero); }
  render(ctx, game) {
    const x = Math.round(this.x), y = Math.round(this.y), s = game.save;
    const unlocked = s.unlocked.includes(this.hero.id), selected = s.selected === this.hero.id;
    this.t += 1 / 60;
    ctx.fillStyle = selected ? 'rgba(255,220,120,0.25)' : 'rgba(0,0,0,0)';
    ctx.beginPath(); ctx.ellipse(x, y + 6, 13, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a5070'; ctx.fillRect(x - 10, y + 2, 20, 8);
    ctx.fillStyle = '#7a6e94'; ctx.fillRect(x - 10, y + 2, 20, 2);
    if (!selected) {
      ctx.globalAlpha = unlocked ? 1 : 0.35;
      drawHero(ctx, this.hero, x, y - 3, 1, 0, false);
      ctx.globalAlpha = 1;
    }
    hudText(ctx, this.hero.name, x, y - 28, selected ? '#ffd84a' : unlocked ? '#fff' : '#888', 'center', 8);
    if (!unlocked) hudText(ctx, `잠김 · ${this.hero.price}골드`, x, y + 11, '#ffd84a', 'center', 8);

}

// 도감/무기고 공용 격자 (탭: 총기 / 지팡이 / 근접 / 활·특수)
const WEAPON_TABS = [
  { name: '총기', test: (d) => d.type === 'gun' && d.shape !== 'staff' },
  { name: '지팡이', test: (d) => d.shape === 'staff' },
  { name: '근접', test: (d) => d.type === 'melee' },
  { name: '활·특수', test: (d) => d.type === 'charge' || d.type === 'beam' }
];
function tabRect(i) { const w = 90, gap = 6, total = w * 4 + gap * 3; return { x: (VIEW_W - total) / 2 + i * (w + gap), y: 22, w, h: 14 }; }
function weaponGrid(tab = 0) {
  const cols = 5, cw = 100, rh = 26, ox = 3, oy = 40;
  return DATA_WEAPONS.filter(WEAPON_TABS[tab].test).map((d, i) => ({ d, x: ox + (i % cols) * (cw + 1), y: oy + Math.floor(i / cols) * rh, w: cw, h: rh - 2 }));
}
function weaponShortLine(d) {
  const dmg = d.projectileCount > 1 ? `${d.damage}×${d.projectileCount}` : d.burst ? `${d.damage}×${d.burst.count}` : d.damage;
  const en = d.type === 'beam' ? `${d.energyPerSec}/초` : (d.energyCost || 0);
  return `피해 ${dmg} · 에너지 ${en}`;
}
function weaponStatLine(d) {
  const dmg = d.projectileCount > 1 ? `${d.damage}×${d.projectileCount}` : d.burst ? `${d.damage}×${d.burst.count}` : d.damage;
  const en = d.type === 'beam' ? `${d.energyPerSec}/초` : (d.energyCost || 0);
  return `${TYPE_NAME[d.type]} · 피해 ${dmg} · 에너지 ${en}`;
}

class Portal {
  constructor(x, y, onEnter, label, color = [90, 160, 255]) { this.x = x; this.y = y; this.t = 0; this.onEnter = onEnter; this.label = label; this.color = color; }
  render(ctx) {
    const x = Math.round(this.x), y = Math.round(this.y), [r, g, b] = this.color;
    for (let i = 3; i >= 0; i--) {
      ctx.fillStyle = `rgba(${Math.min(255, r + i * 30)},${Math.min(255, g + i * 20)},${b},${0.25 + i * 0.12})`;
      const rr = 6 + i * 3 + Math.sin(this.t * 4 + i) * 1.5;
      ctx.beginPath(); ctx.ellipse(x, y, rr, rr * 1.3, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 4; i++) {
      const a = this.t * 2 + i * TAU / 4;
      ctx.fillRect(Math.round(x + Math.cos(a) * 12), Math.round(y + Math.sin(a) * 16), 1, 1);
    }
    if (this.label) hudText(ctx, this.label, x, y - 30, '#bfe0ff', 'center', 8);
  }
}

// 이펙트
// ════════════════════════════════════════════
class Effects {
  constructor() { this.list = []; }
  clear() { this.list.length = 0; }
  text(x, y, str, color) { this.list.push({ kind: 'text', x, y, str, color, t: 0, life: 0.6 }); }
  spark(x, y, color) { this.list.push({ kind: 'spark', x, y, color, t: 0, life: 0.1 }); }
  ring(x, y, r, color) { this.list.push({ kind: 'ring', x, y, r, color, t: 0, life: 0.15 }); }
  slash(x, y, ang, r, arc, color) { this.list.push({ kind: 'slash', x, y, ang, r, arc, color, t: 0, life: 0.14 }); }
  lightning(x0, y0, x1, y1) { this.list.push({ kind: 'bolt', x: x0, y: y0, x1, y1, t: 0, life: 0.15 }); }
  explosion(x, y, r, color) { this.list.push({ kind: 'boom', x, y, r, color, t: 0, life: 0.25 }); this.burst(x, y, color, 12); }
  burst(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + Math.random() * 0.4, s = 40 + Math.random() * 50;
      this.list.push({ kind: 'particle', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, t: 0, life: 0.35 });
    }
  }
  update(dt) {
    for (const fx of this.list) {
      fx.t += dt;
      if (fx.kind === 'text') fx.y -= 20 * dt;
      if (fx.kind === 'particle') { fx.x += fx.vx * dt; fx.y += fx.vy * dt; }
    }
    this.list = this.list.filter((fx) => fx.t < fx.life);
  }
  render(ctx) {
    for (const fx of this.list) {
      const k = 1 - fx.t / fx.life, x = Math.round(fx.x), y = Math.round(fx.y);
      ctx.globalAlpha = k;
      switch (fx.kind) {
        case 'text':
          ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = '#000'; ctx.fillText(fx.str, x + 1, y + 1);
          ctx.fillStyle = fx.color; ctx.fillText(fx.str, x, y); break;
        case 'spark': ctx.fillStyle = fx.color; ctx.fillRect(x - 2, y - 2, 4, 4); break;
        case 'particle': ctx.fillStyle = fx.color; ctx.fillRect(x, y, 2, 2); break;
        case 'ring': ctx.strokeStyle = fx.color; ctx.beginPath(); ctx.arc(x, y, fx.r, 0, TAU); ctx.stroke(); break;
        case 'boom': ctx.fillStyle = fx.color; ctx.beginPath(); ctx.arc(x, y, fx.r * (0.6 + 0.4 * (1 - k)), 0, TAU); ctx.fill(); break;
        case 'slash':
          ctx.strokeStyle = fx.color; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x, y, fx.r * 0.85, fx.ang - fx.arc / 2, fx.ang + fx.arc / 2); ctx.stroke();
          ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, fx.r * 0.55, fx.ang - fx.arc / 2.5, fx.ang + fx.arc / 2.5); ctx.stroke();
          break;
        case 'bolt': {
          ctx.strokeStyle = '#dff4ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y);
          const n = 5;
          for (let i = 1; i < n; i++) {
            const t = i / n;
            ctx.lineTo(fx.x + (fx.x1 - fx.x) * t + randInt(-4, 4), fx.y + (fx.y1 - fx.y) * t + randInt(-4, 4));
          }
          ctx.lineTo(fx.x1, fx.y1); ctx.stroke(); ctx.lineWidth = 1; break;
        }
      }
    }
    ctx.globalAlpha = 1;
  }
}
